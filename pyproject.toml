[project]
name = "ai-search-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sambar226", email = "sameerb22601@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "google-genai>=2.33.0",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "openai>=3.37.0",
    "qdrant-client>=1.20.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sse-starlette>=3.6.0",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-search-engine = "ai_search_engine:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
